  <header class="titlebar">
    <span class="app-name">BUBBLE FIGHTER</span>
    <div class="window-buttons"><button id="minimize" aria-label="最小化">−</button><button id="close" aria-label="关闭">×</button></div>
  </header>
  <main class="launcher-shell">
    <aside class="art-panel" aria-label="游戏画面预留区">
      <div class="art-orb art-orb-one"></div><div class="art-orb art-orb-two"></div>
      <div class="art-copy"><span class="art-kicker">BUBBLE FIGHTER</span><strong>准备<br>出发</strong><span class="art-line"></span></div>
    </aside>
    <section class="work-panel">
      <div class="brand">
        <div class="brand-lockup" aria-label="泡泡战士"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span>泡泡战士</span></div>
        <div class="brand-actions"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false"><svg class="icon-sun" aria-hidden="true"><use href="#icon-sun"></use></svg><svg class="icon-moon" aria-hidden="true"><use href="#icon-moon"></use></svg></button></div>
      </div>
      <div class="card">
        <section id="login-page" class="page">
          <div class="page-heading"><h1>登录<span class="heading-dot">.</span></h1></div>
          <form id="login-form" novalidate>
            <label for="login-name">账号</label><input id="login-name" name="username" autocomplete="username" spellcheck="false" placeholder="输入账号" maxlength="24">
            <label for="login-password">密码</label><div class="password-field"><input id="login-password" type="password" autocomplete="current-password" placeholder="输入密码" maxlength="128"><button type="button" class="eye" data-password="login-password" aria-label="显示密码"><svg class="icon-eye" aria-hidden="true"><use href="#icon-eye"></use></svg><svg class="icon-eye-slash" aria-hidden="true"><use href="#icon-eye-slash"></use></svg></button></div>
            <button class="primary text-2xl!" type="submit">登录</button>
          </form>
          <div class="function-buttons"><button id="open-settings" class="secondary" type="button">设置</button><button id="go-register" class="secondary" type="button">注册</button></div>
        </section>
        <section id="register-page" class="page" hidden>
          <div class="page-heading register-heading"><button class="w-[45px] h-[45px] flex-shrink-0 back-button" id="go-login" type="button" aria-label="返回登录" title="返回"><svg aria-hidden="true"><use href="#icon-left-long"></use></svg></button><h1>注册<span class="heading-dot">.</span></h1></div>
          <form id="register-form" novalidate>
            <label for="register-name">账号</label><input id="register-name" autocomplete="username" spellcheck="false" placeholder="3–24 位字母、数字或下划线" maxlength="24">
            <label for="register-password">密码</label><div class="password-field"><input id="register-password" type="password" autocomplete="new-password" placeholder="设置 8–64 位密码" maxlength="128"><button type="button" class="eye" data-password="register-password" aria-label="显示密码"><svg class="icon-eye" aria-hidden="true"><use href="#icon-eye"></use></svg><svg class="icon-eye-slash" aria-hidden="true"><use href="#icon-eye-slash"></use></svg></button></div>
            <label for="register-confirm">确认密码</label><input id="register-confirm" type="password" autocomplete="new-password" placeholder="再次输入密码" maxlength="128">
            <button class="primary text-2xl!" type="submit">注册</button>
          </form>
        </section>
        <section id="ready-page" class="page" hidden>
          <div class="page-heading"><h1>选择服务器<span class="heading-dot">.</span></h1></div>
          <div id="server-grid" class="server-grid" role="radiogroup" aria-label="选择服务器"></div>
          <button id="go-add-server" class="server-empty" type="button" hidden><svg aria-hidden="true"><use href="#icon-plus"></use></svg><span>去添加服务器</span></button>
          <button id="launch" class="primary" type="button">启动游戏</button>
          <div class="grid gap-3 grid-cols-3 w-full mt-[14px]">
            <button id="ready-settings" class="secondary col-span-2" type="button">设置</button>
            <button id="logout" class="secondary col-span-1" type="button">重新登录</button>
          </div>
        </section>
        <section id="settings-page" class="page settings-page" hidden>
          <div class="settings-heading"><button id="settings-back" class="w-[45px] h-[45px] flex-shrink-0 back-button" type="button" aria-label="返回" title="返回"><svg aria-hidden="true"><use href="#icon-left-long"></use></svg></button><h1>设置<span class="heading-dot">.</span></h1></div>
          <div class="settings-list">
            <div class="setting-row"><div><strong>服务器</strong></div><button id="custom-server" class="tiny-button" type="button">自定义</button></div>
            <div class="setting-row client-setting" id="client-setting-row"><div><strong>游戏客户端</strong><span id="client-file">正在检查客户端…</span><small id="client-warning" class="client-warning" hidden>当前目录未找到游戏客户端</small></div><button id="select-client" class="tiny-button" type="button">选择文件</button></div>
            <div class="setting-row"><div><strong>主题</strong><span>切换启动器外观</span></div><button id="settings-theme-toggle" class="tiny-button" type="button">切换</button></div>
          </div>
          <input id="host" type="hidden" value="127.0.0.1"><input id="port" type="hidden" value="7100"><span id="server-state" class="compat-hidden" aria-hidden="true"></span>
        </section>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
      <div class="progress-container" aria-hidden="true"><div class="progress"></div><span class="progress-text"></span></div>
    </section>
  </main>
  <div id="server-list-dialog" class="app-dialog" role="dialog" aria-modal="true" aria-labelledby="server-list-title" hidden>
    <div class="app-dialog-panel"><h2 id="server-list-title">服务器设置</h2><div id="server-list" class="server-list"></div><div class="dialog-actions"><button id="add-server" class="secondary" type="button"><svg aria-hidden="true"><use href="#icon-plus"></use></svg>添加</button><button id="close-server-list" class="secondary" type="button">关闭</button></div></div>
  </div>
  <div id="server-dialog" class="app-dialog" role="dialog" aria-modal="true" aria-labelledby="server-dialog-title" hidden>
    <div class="app-dialog-panel"><h2 id="server-dialog-title">添加服务器</h2><form id="server-form" novalidate><label for="custom-name">名称</label><input id="custom-name" maxlength="5" placeholder="输入名称（可选）" spellcheck="false"><span class="char-counter" aria-live="polite">0/5</span><label for="custom-host">服务器 IP</label><input id="custom-host" placeholder="输入服务器 IP" spellcheck="false"><label for="custom-port">端口</label><input id="custom-port" inputmode="numeric" maxlength="5" placeholder="输入端口"><div class="dialog-actions"><button id="cancel-server" class="secondary" type="button">取消</button><button class="primary dialog-confirm" type="submit"><span>确认</span></button></div></form></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
