name: Windows Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix launcher
      - name: Build and validate release package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BubbleFighterLauncher-win32-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BubbleFighterLauncher-win32-x64
          path: release
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\n下载 Windows x64 ZIP 后完整解压到游戏根目录，运行 `GameLauncher.exe`。客户端和服务端需另行准备。\n\n使用 `SHA256SUMS.txt` 校验下载文件。\n' >> release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --verify-tag --latest --title "BubbleFighter Launcher $GITHUB_REF_NAME" \
            --notes-file release-notes.md
